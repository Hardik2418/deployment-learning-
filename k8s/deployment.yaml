apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-learning
  labels:
    app: deployment-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deployment-learning
  template:
    metadata:
      labels:
        app: deployment-learning
    spec:
      containers:
        - name: deployment-learning
          image: deployment-learning:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: deployment-learning-secrets
                  key: mongodb-uri
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
